name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Guards, PHPStan, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nitro
      - uses: ./nitro/.github/actions/setup
      - name: Architecture guards
        working-directory: nitro
        run: vendor/bin/phpunit --testsuite architecture
      - name: PHPStan
        working-directory: nitro
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: dist/nitro.js is built from js/src
        working-directory: nitro
        run: |
          npm run build
          git diff --exit-code -- dist/ || (echo "::error::dist/nitro.js is not the build of js/src: run npm run build and commit it" && exit 1)

  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            args: --testsuite unit
          - name: feature
            args: --testsuite feature
          # The runtime in jsdom, the whole fixture app per case (about a minute each).
          - name: browser
            args: --testsuite browser
    steps:
      - uses: actions/checkout@v7
        with:
          path: nitro
      - uses: ./nitro/.github/actions/setup
      - name: Tests
        working-directory: nitro
        run: vendor/bin/phpunit ${{ matrix.args }}

  # Nitro in a new Laravel app, installed as Composer ships it (tests/App/run.php), on the oldest
  # PHP Nitro supports and the newest.
  app:
    name: In a new app (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          path: nitro
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip, curl
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: A new app with Nitro, tested
        working-directory: nitro
        run: php tests/App/run.php "$RUNNER_TEMP/nitro-app"
