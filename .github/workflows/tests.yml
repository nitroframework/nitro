name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Guards, PHPStan, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nitro-fusion
      # composer.json takes nitro/framework from ../nitro-framework, as on a developer's machine.
      - uses: actions/checkout@v4
        with:
          repository: NitroFramework/framework
          path: nitro-framework
      - uses: ./nitro-fusion/.github/actions/setup
      - name: Architecture guards
        working-directory: nitro-fusion
        run: vendor/bin/phpunit --testsuite architecture
      - name: PHPStan
        working-directory: nitro-fusion
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: dist/fusion.js is built from js/src
        working-directory: nitro-fusion
        run: |
          npm run build
          git diff --exit-code -- dist/ || (echo "::error::dist/fusion.js is not the build of js/src: run npm run build and commit it" && exit 1)

  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            args: --testsuite unit
          - name: feature
            args: --testsuite feature
          # The runtime in jsdom, the whole fixture app per case (about a minute each): one job per framework.
          - name: browser (laravel)
            args: --testsuite browser --filter '/data set "laravel"|ProgressTest/'
          - name: browser (nitro)
            args: --testsuite browser --filter '/data set "nitro"/'
    steps:
      - uses: actions/checkout@v4
        with:
          path: nitro-fusion
      - uses: actions/checkout@v4
        with:
          repository: NitroFramework/framework
          path: nitro-framework
      - uses: ./nitro-fusion/.github/actions/setup
      - name: Tests
        working-directory: nitro-fusion
        run: vendor/bin/phpunit ${{ matrix.args }}
