name: Set up Nitro
description: PHP, Node and the dependencies, for a job that checked out the repository into nitro.

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, intl, pdo_sqlite, sqlite3
        coverage: none
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: nitro/package-lock.json
    - name: Composer cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/composer
        key: composer-${{ hashFiles('nitro/composer.lock') }}
        restore-keys: composer-
    - shell: bash
      working-directory: nitro
      run: composer install --no-interaction --no-progress --prefer-dist
    - shell: bash
      working-directory: nitro
      run: npm ci --no-audit --no-fund
